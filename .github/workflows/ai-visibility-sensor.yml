name: ai-visibility-index-sensor

on:
  schedule:
    - cron: "0 13 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stamp a dated heartbeat marker
        run: |
          TODAY=$(date -u +%F)
          mkdir -p data
          echo "$TODAY weekly re-check due: run all five engines, append real rows, win or loss." >> data/heartbeat.log
          git config user.name "namebeam-sensor"
          git config user.email "sensor@namebeam.ai"
          git add data/heartbeat.log
          git commit -m "sensor: weekly heartbeat $TODAY" || echo "no change"
          git push || echo "push skipped"
      - name: Open a dated re-check reminder issue
        uses: actions/github-script@v7
        with:
          script: |
            const today = new Date().toISOString().slice(0,10);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "AI Visibility re-check due " + today,
              body: "Run the five-engine check on Namebeam, append each real result win or loss, commit. No fabricated rows. Doctrine: DATA_FRONTRUN."
            });

      # Sentry Crons (2026-10-25, [OPUS55-COS-1025A]): one check-in per run, ok on success,
      # error otherwise; a run that never starts shows as missed after the grace period and
      # emails Terry (alert "Namebeam: any job or uptime issue, email Terry", project
      # namebeam-jobs). The DSN is Sentry's public client key, same pattern as the PostHog key
      # in e1-check-runner.yml; override with repo variable SENTRY_DSN, kill switch
      # DISABLE_SENTRY. Never fails the job, never touches corpus rows.
      - name: Report the run to Sentry Crons
        if: always()
        continue-on-error: true
        env:
          SENTRY_DSN: ${{ vars.SENTRY_DSN || 'https://fac773179a0ef5c7296de8b92796d144@o4512319421349888.ingest.us.sentry.io/4512319519195136' }}
          DISABLE_SENTRY: ${{ vars.DISABLE_SENTRY }}
        run: python3 scripts/sentry_checkin.py ai-visibility-sensor-weekly "${{ job.status }}" "0 13 * * 1" 240
