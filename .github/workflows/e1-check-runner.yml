name: E1 Check Runner

# v8, four engines + SERP. Every engine whose key is present gets asked the SAME
# dated question, and each answer is written as its own corpus row. An engine
# whose key is absent logs a FAILED row and the run continues; it never
# blocks the engines that do work.
on:
  workflow_dispatch:
    # RE-RUN ONLY FAILED CELLS (2026-10-24, [SONNET-BEDROCK-EXPIRY-1024]). All three inputs are
    # optional; leave them blank for the normal full run. See scripts/e1_runner.py
    # (parse_rerun_options) for the exact rules. Example, the 2026-10-24 Anthropic cells:
    # only_engines = anthropic, only_failed = true, date_utc = 2026-10-24.
    inputs:
      only_engines:
        description: "Comma list of engines to ask (perplexity, gemini, openai, anthropic, serp). Blank = all."
        required: false
        default: ""
        type: string
      only_failed:
        description: "Ask only cells whose row for the date is FAILED with no OK row yet (needs only_engines). Answers land as _rN rows; FAILED rows are never overwritten."
        required: false
        default: false
        type: boolean
      date_utc:
        description: "YYYY-MM-DD of the failed cells to re-ask (needs only_failed). Blank = today (UTC)."
        required: false
        default: ""
        type: string
  schedule:
  - cron: "10 12 * * *"
  # BACKSTOP (2026-10-06, [FABLE-COS-1006A], R61): on 2026-10-05 the 12:10Z run was
  # delayed by GitHub to 20:31Z and then cancelled: "The job was not acquired by Runner
  # of type hosted even after multiple attempts". No E1 record exists for 2026-10-05 and
  # it cannot be backfilled. A second daily slot runs only when today's record is missing.
  - cron: "40 21 * * *"

concurrency:
  group: e1-check-runner
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

# PostHog AI Observability (2026-10-23): one $ai_generation event per engine call, sent in one
# batch at the end of the run by scripts/posthog_llm_obs.py. Best-effort: it never changes a corpus
# row or the exit code. The key is PostHog's PUBLIC write key (the same one the sites ship in
# /posthog.js); rotate it by setting the repo variable POSTHOG_PROJECT_KEY, no commit needed.
# Kill switch: set the repo variable DISABLE_POSTHOG to 1 (any value but empty/0/false/no/off).
# Prompt and answer text are never sent.
env:
  POSTHOG_PROJECT_KEY: ${{ vars.POSTHOG_PROJECT_KEY || 'phc_kKsaZbRt2hgQG4a24VW7VFEPxkcESnKWWWHaYRwyYc2v' }}
  DISABLE_POSTHOG: ${{ vars.DISABLE_POSTHOG }}

jobs:
  run-e1-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Backstop guard (a scheduled run skips if today's record already exists)
        id: guard
        run: |
          D=$(date -u +%Y-%m-%d)
          H=$(date -u +%H)
          # MIDNIGHT GUARD (2026-10-08, [OPUS55-COS-1008A], R61): GitHub started the 21:40Z
          # backstop of 2026-10-06 at 01:00Z on 2026-10-07, so it wrote the 10-07 record before
          # the 02:55Z roster merge, and the real 12:10Z run (started 18:51Z) skipped; the six
          # dental/orthodontist segments lost 2026-10-07. A scheduled run that starts before
          # 12:00Z is a late backstop from the previous day; today's 12:10Z slot owns today.
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$H" -lt 12 ]; then
            echo "Scheduled run started at ${H}Z: a late backstop that crossed midnight; the 12:10Z slot owns $D. Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "schedule" ] && ls corpus/e1/NB-CZ-API_${D}_namebeam_*.json >/dev/null 2>&1; then
            echo "E1 record for $D already exists; this scheduled run is the backstop and skips."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "No E1 record for $D yet (or a manual run); running."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python 3.12
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests and boto3
        if: steps.guard.outputs.skip != 'true'
        run: pip install requests boto3

      # Bedrock path (AWS credit). Runs only when the repo variable
      # AWS_BEDROCK_ROLE_ARN is set; otherwise the API key path is used.
      - name: Configure AWS credentials (OIDC)
        if: steps.guard.outputs.skip != 'true' && vars.AWS_BEDROCK_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_BEDROCK_ROLE_ARN }}
          aws-region: us-east-1
          # Explicit, and not above the role's maximum session. The run outlives this hour on
          # a long day, so scripts/engines.py re-mints the session itself (see its TOKEN REFRESH
          # note); this value only says how long each mint lasts.
          role-duration-seconds: 3600

      # Tells the Bedrock adapter when the credentials above were minted so it refreshes at 50
      # minutes, before they expire. A timestamp only, never a credential.
      - name: Record when the AWS credentials were minted
        if: steps.guard.outputs.skip != 'true' && vars.AWS_BEDROCK_ROLE_ARN != ''
        run: echo "AWS_CREDS_MINTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      # Reports which engines are wired WITHOUT ever printing a value.
      # Only ever echoes "present" or "MISSING", never the secret itself.
      - name: Report which engine keys are present
        if: steps.guard.outputs.skip != 'true'
        env:
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_FREE: ${{ secrets.GEMINI_API_KEY_FREE }}
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          for k in PERPLEXITY_API_KEY GEMINI_API_KEY GEMINI_API_KEY_FREE BRIGHTDATA_API_KEY OPENAI_API_KEY ANTHROPIC_API_KEY; do
            if [ -n "${!k}" ]; then echo "$k: present"; else echo "$k: MISSING"; fi
          done
          echo "NOTE: OPENAI is intentionally DEACTIVATED as of 2026-08-06. The secret"
          echo "still exists and reports present here, but it is NOT mapped into the"
          echo "runner step, so no openai rows are written. Reason: API account balance"
          echo "is zero. This corpus is THREE engines (perplexity, gemini, anthropic)"
          echo "plus Bright Data SERP until credits are added."
          if [ -z "$PERPLEXITY_API_KEY" ] && [ -z "$GEMINI_API_KEY" ] && [ -z "$BRIGHTDATA_API_KEY" ]; then
            echo "ERROR: no engine keys are set. Add them in Settings > Secrets and variables > Actions."
            exit 1
          fi

      # THE FIX. GitHub secrets are NOT automatically visible to a workflow.
      # Each one must be mapped into the step env explicitly. The previous
      # version mapped only PERPLEXITY_API_KEY, which is why Gemini reported
      # "key not set" on every row and no SERP rows were ever written, even
      # though both secrets existed in the repo.
      - name: Run the E1 check runner
        if: steps.guard.outputs.skip != 'true'
        env:
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_FREE: ${{ secrets.GEMINI_API_KEY_FREE }}
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
          # Bright Data zone names are chosen by the account holder. If a
          # repo variable named BRIGHTDATA_ZONE exists it is used; otherwise
          # engines.py falls back to its default and a wrong zone simply logs
          # a clean HTTP failure on the SERP rows. Engine rows are unaffected.
          BRIGHTDATA_ZONE: ${{ vars.BRIGHTDATA_ZONE }}
          # OPENAI DEACTIVATED 2026-08-06 on Terry's decision (option D).
          # The key is valid and correctly placed. The API ACCOUNT BALANCE IS ZERO:
          # platform.openai.com reports Free trial, credit remaining $0.00, no payment
          # method, and the key carter_enterprise_llc shows lifetime spend of $0.00.
          # OpenAI's ChatGPT Business subscription does NOT fund the API; OpenAI state
          # this themselves. Leaving the key mapped made the runner attempt openai and
          # write 13 QUOTA_BLOCKED rows per day, which is a dead engine riding along in
          # every denominator. The runner picks engines by which <ENGINE>_API_KEY is
          # present in env, so UNMAPPING the key is the whole deactivation: no code
          # change, no secret deleted, nothing destroyed.
          # TO REACTIVATE: add credits at platform.openai.com, then uncomment the line
          # below. openai validates on the next scheduled run with no other change.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Model strings for the v8 engines are PENDING VERIFICATION on the
          # first live run. A wrong default logs a clean HTTP 404 row; fix it
          # WITHOUT a commit by adding repo VARIABLES OPENAI_MODEL and/or
          # ANTHROPIC_MODEL (Settings > Secrets and variables > Actions > Variables).
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          # Bedrock path: non-empty BEDROCK_MODEL_ID routes the anthropic engine to Bedrock.
          BEDROCK_MODEL_ID: ${{ vars.BEDROCK_MODEL_ID }}
          AWS_REGION: us-east-1
          # The same role the configure step assumed; engines.py uses it to re-mint the session
          # (GitHub OIDC -> sts AssumeRoleWithWebIdentity) when the 1-hour token runs out.
          AWS_ROLE_ARN: ${{ vars.AWS_BEDROCK_ROLE_ARN }}
          # Optional re-run controls (blank on a scheduled run). Passed through env, never
          # interpolated into the shell; e1_runner.py validates them.
          E1_ONLY_ENGINES: ${{ inputs.only_engines }}
          E1_ONLY_FAILED: ${{ inputs.only_failed }}
          E1_DATE_UTC: ${{ inputs.date_utc }}
          # R82 (2026-10-24): Perplexity and AI Overview raw text goes to private_e1/, never to the
          # public corpus. Set to 0 to write it publicly again.
          PRIVATE_RAW: "1"
        run: python scripts/e1_runner.py

      # R82 option B (2026-10-26, FABLE-TEAM-COS-1027A, NS_SECURITY_1026 HIGH 1): the private raw text goes to the
      # PRIVATE Brain repo over PRIVATE_BRAIN_TOKEN (Contents read and write on carter-brain, hand H464).
      # The token is used only as a git credential on the clone URL and is never echoed.
      - name: Push the private raw copy to the private Brain
        id: private_push
        if: ${{ always() && steps.guard.outputs.skip != 'true' && hashFiles('private_e1/**') != '' }}
        env:
          PRIVATE_BRAIN_TOKEN: ${{ secrets.PRIVATE_BRAIN_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_BRAIN_TOKEN"
          day="$(date -u +%F)"
          git clone -q --depth 1 "https://x-access-token:${PRIVATE_BRAIN_TOKEN}@github.com/mrcrtr1979-droid/carter-brain" /tmp/brain
          mkdir -p "/tmp/brain/private_e1/${day}"
          cp -r private_e1/. "/tmp/brain/private_e1/${day}/"
          cd /tmp/brain
          git config user.name "e1-private-sink"
          git config user.email "actions@namebeam.ai"
          git add private_e1
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -q -m "private_e1 ${day}: R82 raw text from run ${GITHUB_RUN_ID}"
          git push -q origin HEAD:main
          echo "pushed private_e1/${day} to carter-brain"

      # Fallback only: if the private push failed, keep the artifact so the day's text is not lost (public-repo
      # artifacts are downloadable by any signed-in GitHub user, so this is never the primary sink).
      - name: Keep the private raw copy (fallback, push failed)
        if: ${{ always() && steps.guard.outputs.skip != 'true' && steps.private_push.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: private-raw-${{ github.run_id }}
          path: private_e1/
          retention-days: 7
          if-no-files-found: ignore

      # S1-1 (2026-10-08, [SONNET-RECORD-1008E-S1]): the daily sources dataset.
      # Writes datasets/e1/sources/sources_<date>.csv from the raw answers just
      # collected, and heals any earlier day that has none. It NEVER blocks the
      # corpus commit below: a guard (UNMAPPED field, EMPTY-DAY, selftest fail)
      # prints a warning annotation and the run continues.
      - name: Build the sources dataset
        if: steps.guard.outputs.skip != 'true'
        run: |
          python3 -I scripts/build_sources.py --selftest || echo "::warning::sources selftest failed"
          python3 -I scripts/build_sources.py --missing --strict || echo "::warning::sources build reported a guard (UNMAPPED or EMPTY-DAY), see the log above"
          python3 -I scripts/build_sources.py --date "$(date -u +%Y-%m-%d)" --strict || echo "::warning::sources for today reported a guard or no raw files, see the log above"
          python3 -I scripts/customer_zero.py --selftest || echo "::warning::customer_zero selftest failed"
          python3 -I scripts/customer_zero.py --check-baseline || echo "::warning::customer_zero reported STALE-SOURCES or a baseline mismatch, see the log above"
          python3 -I scripts/own_name_rate.py --selftest || echo "::warning::own_name_rate selftest failed"
          python3 -I scripts/own_name_rate.py || echo "::warning::own_name_rate build failed"

      - name: Commit and push any new corpus rows
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add corpus/e1/ datasets/e1/sources/ datasets/e1/customer_zero/ datasets/e1/own_name/
          if git diff --staged --quiet; then
            echo "No new corpus rows to commit."
          else
            git commit -m "e1 slice run $(date -u +%Y-%m-%d)"
            # Run #10 lost 78 files of four-engine data because another
            # workflow pushed to main mid-run and the plain push was
            # rejected. Rebase-and-retry so a race can never destroy a
            # completed run's rows again.
            for i in 1 2 3; do
              git push && break
              echo "push rejected, rebasing (attempt $i)"
              git pull --rebase origin main
            done
          fi

      # Sentry Crons (2026-10-25, [OPUS55-COS-1025A]): one check-in per run, ok on success,
      # error otherwise; a run that never starts shows as missed after the grace period and
      # emails Terry (alert "Namebeam: any job or uptime issue, email Terry", project
      # namebeam-jobs). The DSN is Sentry's public client key, same pattern as the PostHog key
      # in e1-check-runner.yml; override with repo variable SENTRY_DSN, kill switch
      # DISABLE_SENTRY. Never fails the job, never touches corpus rows.
      - name: Report the run to Sentry Crons
        if: always()
        continue-on-error: true
        env:
          SENTRY_DSN: ${{ vars.SENTRY_DSN || 'https://fac773179a0ef5c7296de8b92796d144@o4512319421349888.ingest.us.sentry.io/4512319519195136' }}
          DISABLE_SENTRY: ${{ vars.DISABLE_SENTRY }}
        run: python3 scripts/sentry_checkin.py e1-daily-record "${{ job.status }}" "10 12 * * *" 600
