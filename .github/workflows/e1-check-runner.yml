name: E1 Check Runner

# v8, four engines + SERP. Every engine whose key is present gets asked the SAME
# dated question, and each answer is written as its own corpus row. An engine
# whose key is absent logs a FAILED row and the run continues; it never
# blocks the engines that do work.
on:
  workflow_dispatch: {}
  schedule:
  - cron: "10 12 * * *"
  # BACKSTOP (2026-10-06, [FABLE-COS-1006A], R61): on 2026-10-05 the 12:10Z run was
  # delayed by GitHub to 20:31Z and then cancelled: "The job was not acquired by Runner
  # of type hosted even after multiple attempts". No E1 record exists for 2026-10-05 and
  # it cannot be backfilled. A second daily slot runs only when today's record is missing.
  - cron: "40 21 * * *"

concurrency:
  group: e1-check-runner
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-e1-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Backstop guard (a scheduled run skips if today's record already exists)
        id: guard
        run: |
          D=$(date -u +%Y-%m-%d)
          H=$(date -u +%H)
          # MIDNIGHT GUARD (2026-10-08, [OPUS55-COS-1008A], R61): GitHub started the 21:40Z
          # backstop of 2026-10-06 at 01:00Z on 2026-10-07, so it wrote the 10-07 record before
          # the 02:55Z roster merge, and the real 12:10Z run (started 18:51Z) skipped; the six
          # dental/orthodontist segments lost 2026-10-07. A scheduled run that starts before
          # 12:00Z is a late backstop from the previous day; today's 12:10Z slot owns today.
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$H" -lt 12 ]; then
            echo "Scheduled run started at ${H}Z: a late backstop that crossed midnight; the 12:10Z slot owns $D. Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "schedule" ] && ls corpus/e1/NB-CZ-API_${D}_namebeam_*.json >/dev/null 2>&1; then
            echo "E1 record for $D already exists; this scheduled run is the backstop and skips."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "No E1 record for $D yet (or a manual run); running."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python 3.12
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        if: steps.guard.outputs.skip != 'true'
        run: pip install requests

      # Reports which engines are wired WITHOUT ever printing a value.
      # Only ever echoes "present" or "MISSING", never the secret itself.
      - name: Report which engine keys are present
        if: steps.guard.outputs.skip != 'true'
        env:
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          for k in PERPLEXITY_API_KEY GEMINI_API_KEY BRIGHTDATA_API_KEY OPENAI_API_KEY ANTHROPIC_API_KEY; do
            if [ -n "${!k}" ]; then echo "$k: present"; else echo "$k: MISSING"; fi
          done
          echo "NOTE: OPENAI is intentionally DEACTIVATED as of 2026-08-06. The secret"
          echo "still exists and reports present here, but it is NOT mapped into the"
          echo "runner step, so no openai rows are written. Reason: API account balance"
          echo "is zero. This corpus is THREE engines (perplexity, gemini, anthropic)"
          echo "plus Bright Data SERP until credits are added."
          if [ -z "$PERPLEXITY_API_KEY" ] && [ -z "$GEMINI_API_KEY" ] && [ -z "$BRIGHTDATA_API_KEY" ]; then
            echo "ERROR: no engine keys are set. Add them in Settings > Secrets and variables > Actions."
            exit 1
          fi

      # THE FIX. GitHub secrets are NOT automatically visible to a workflow.
      # Each one must be mapped into the step env explicitly. The previous
      # version mapped only PERPLEXITY_API_KEY, which is why Gemini reported
      # "key not set" on every row and no SERP rows were ever written, even
      # though both secrets existed in the repo.
      - name: Run the E1 check runner
        if: steps.guard.outputs.skip != 'true'
        env:
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
          # Bright Data zone names are chosen by the account holder. If a
          # repo variable named BRIGHTDATA_ZONE exists it is used; otherwise
          # engines.py falls back to its default and a wrong zone simply logs
          # a clean HTTP failure on the SERP rows. Engine rows are unaffected.
          BRIGHTDATA_ZONE: ${{ vars.BRIGHTDATA_ZONE }}
          # OPENAI DEACTIVATED 2026-08-06 on Terry's decision (option D).
          # The key is valid and correctly placed. The API ACCOUNT BALANCE IS ZERO:
          # platform.openai.com reports Free trial, credit remaining $0.00, no payment
          # method, and the key carter_enterprise_llc shows lifetime spend of $0.00.
          # OpenAI's ChatGPT Business subscription does NOT fund the API; OpenAI state
          # this themselves. Leaving the key mapped made the runner attempt openai and
          # write 13 QUOTA_BLOCKED rows per day, which is a dead engine riding along in
          # every denominator. The runner picks engines by which <ENGINE>_API_KEY is
          # present in env, so UNMAPPING the key is the whole deactivation: no code
          # change, no secret deleted, nothing destroyed.
          # TO REACTIVATE: add credits at platform.openai.com, then uncomment the line
          # below. openai validates on the next scheduled run with no other change.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Model strings for the v8 engines are PENDING VERIFICATION on the
          # first live run. A wrong default logs a clean HTTP 404 row; fix it
          # WITHOUT a commit by adding repo VARIABLES OPENAI_MODEL and/or
          # ANTHROPIC_MODEL (Settings > Secrets and variables > Actions > Variables).
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
        run: python scripts/e1_runner.py

      # S1-1 (2026-10-08, [SONNET-RECORD-1008E-S1]): the daily sources dataset.
      # Writes datasets/e1/sources/sources_<date>.csv from the raw answers just
      # collected, and heals any earlier day that has none. It NEVER blocks the
      # corpus commit below: a guard (UNMAPPED field, EMPTY-DAY, selftest fail)
      # prints a warning annotation and the run continues.
      - name: Build the sources dataset
        if: steps.guard.outputs.skip != 'true'
        run: |
          python3 -I scripts/build_sources.py --selftest || echo "::warning::sources selftest failed"
          python3 -I scripts/build_sources.py --missing --strict || echo "::warning::sources build reported a guard (UNMAPPED or EMPTY-DAY), see the log above"
          python3 -I scripts/build_sources.py --date "$(date -u +%Y-%m-%d)" --strict || echo "::warning::sources for today reported a guard or no raw files, see the log above"

      - name: Commit and push any new corpus rows
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add corpus/e1/ datasets/e1/sources/
          if git diff --staged --quiet; then
            echo "No new corpus rows to commit."
          else
            git commit -m "e1 slice run $(date -u +%Y-%m-%d)"
            # Run #10 lost 78 files of four-engine data because another
            # workflow pushed to main mid-run and the plain push was
            # rejected. Rebase-and-retry so a race can never destroy a
            # completed run's rows again.
            for i in 1 2 3; do
              git push && break
              echo "push rejected, rebasing (attempt $i)"
              git pull --rebase origin main
            done
          fi
