name: MCP Publish

on:
  workflow_dispatch:
  push:
    tags:
      - 'mcp-v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check NPM_TOKEN
        working-directory: .
        run: |
          if [ -z "${{ secrets.NPM_TOKEN }}" ]; then
            echo "Error: NPM_TOKEN secret is empty"
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run tests
        run: npm test

      - name: Publish to npm
        run: npm view "receipts-index-mcp@$(npm pkg get version | tr -d '"')" version || npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Wait until npm shows this version
        run: |
          V="$(npm pkg get version | tr -d '"')"
          for i in $(seq 1 18); do
            npm view "receipts-index-mcp@$V" version >/dev/null 2>&1 && { echo "npm shows $V"; exit 0; }
            echo "npm does not show $V yet (try $i of 18)"; sleep 10
          done
          echo "::error::npm still does not show receipts-index-mcp@$V after 3 minutes"; exit 1

      - name: Install MCP Registry Publisher CLI
        run: |
          curl -sL https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz | tar xz
          sudo mv mcp-publisher /usr/local/bin/

      - name: Login to MCP Registry
        run: mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: mcp-publisher publish
