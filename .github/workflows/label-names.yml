name: label-names
# Labels candidate names BUSINESS / NOT_BUSINESS / UNSURE with Claude Haiku 4.5 via the Message Batches API.
# Appends to corpus/labels/name_labels.csv and opens a PR from a branch. Never pushes to main.
on:
  workflow_dispatch:
    inputs:
      max_names:
        description: 'Cap on names sent to the API (0 = all unlabeled)'
        required: false
        default: '200'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: label-names
  cancel-in-progress: false

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_CREDIT }}
      # Boolean only, never the token. GitHub does not allow the secrets context in a step `if`, so the
      # shadow steps gate on this env flag; it is 'false' until CLOUDFLARE_AI_TOKEN is pasted into this repo.
      CF_AI_PRESENT: ${{ secrets.CLOUDFLARE_AI_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Dry run (no API call)
        run: python3 -I scripts/label_names.py --dry-run --out "$RUNNER_TEMP"
      - name: Label names
        run: python3 -I scripts/label_names.py --run --max-names "${{ github.event.inputs.max_names || '200' }}"
      # WORKERSAI-LANE1-1026 shadow: same names, same prompt, Workers AI gpt-oss-120b. Reads the rows the step
      # above appended, writes only to RUNNER_TEMP, never edits name_labels.csv. No-op until the secret exists.
      - name: Shadow label with Workers AI (agreement report only)
        if: ${{ env.CF_AI_PRESENT == 'true' }}
        continue-on-error: true
        env:
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKERSAI_COST_LOG: ${{ runner.temp }}/WORKERSAI_COST_LOG.csv
        run: |
          python3 -I scripts/workers_ai/selftest.py
          python3 -I scripts/workers_ai/shadow.py --repo . --report "$RUNNER_TEMP/WORKERSAI_SHADOW_REPORT.md"
      - name: Keep the shadow report and cost log
        if: ${{ always() && env.CF_AI_PRESENT == 'true' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: workersai-shadow-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/WORKERSAI_SHADOW_REPORT.md
            ${{ runner.temp }}/WORKERSAI_COST_LOG.csv
          retention-days: 90
          if-no-files-found: ignore
      - name: Open PR with new label rows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- corpus/labels/name_labels.csv && [ -z "$(git ls-files --others --exclude-standard corpus/labels)" ]; then
            echo "no new labels"; exit 0
          fi
          BR="labels/names-$(date -u +%Y%m%d-%H%M)"
          git config user.name "label-names bot"
          git config user.email "label-names@users.noreply.github.com"
          git checkout -b "$BR"
          git add corpus/labels/name_labels.csv
          git commit -m "Append name labels (Haiku 4.5 batch) $(date -u +%F)"
          git push origin "$BR"
          gh pr create --base main --head "$BR" --title "Name labels $(date -u +%F)" \
            --body "Append-only rows for corpus/labels/name_labels.csv. No existing corpus rows were edited. Model claude-haiku-4-5-20251001 via Message Batches API." \
            || echo "PR not opened (repo setting blocks Actions from creating PRs). Branch is pushed: https://github.com/$GITHUB_REPOSITORY/compare/main...$BR"
