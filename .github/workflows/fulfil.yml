# TEST MODE build (draft PR "do not merge"). DRY_RUN is ON unless the repo variable FULFIL_DRY_RUN is exactly "false".
# This repository is public: the dispatch payload carries only sale_id. The runner reads the buyer row from D1.
# There is no push trigger and none may be added back: a push run would execute with a fixture and teach nothing.
# repository_dispatch and workflow_dispatch run from the default branch only, so nothing fires until this is merged.
name: fulfil
run-name: fulfil ${{ github.event.client_payload.sale_id || inputs.sale_id }}

on:
  repository_dispatch:
    types: [namebeam-sale]
  workflow_dispatch:
    inputs:
      sale_id:
        description: 'Sale id (cs_... or in_...) already in D1 with status DISPATCHED'
        required: true

permissions:
  contents: read

concurrency:
  group: fulfil-${{ github.event.client_payload.sale_id || inputs.sale_id }}
  cancel-in-progress: false

jobs:
  fulfil:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install reportlab pypdf
      - name: Offline tests
        run: python3 scripts/fulfil/test_run_fulfil.py
      - name: Fulfil
        env:
          SALE_ID: ${{ github.event.client_payload.sale_id || inputs.sale_id }}
          DRY_RUN: ${{ vars.FULFIL_DRY_RUN || 'true' }}
          TEST_TO: ${{ vars.FULFIL_TEST_TO }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          CF_D1_TOKEN: ${{ secrets.CF_D1_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          D1_DB_ID: ${{ secrets.D1_DB_ID }}
          REPO_ROOT: ${{ github.workspace }}
        run: python3 scripts/fulfil/run_fulfil.py
